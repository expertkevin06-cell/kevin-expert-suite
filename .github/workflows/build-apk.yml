name: Build Kevin Expert Suite APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          import pathlib

          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          permissions = [
              "INTERNET",
              "ACCESS_NETWORK_STATE",
              "POST_NOTIFICATIONS"
          ]

          for permission in permissions:
              tag = f'<uses-permission android:name="android.permission.{permission}" />'
              if tag not in content:
                  content = content.replace("<application", tag + "\n    <application", 1)

          manifest.write_text(content, encoding="utf-8")
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kevin-expert-suite-v3-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-v3-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Kevin Expert Suite APK V3 Fusion - run ${GITHUB_RUN_NUMBER}" \
            --notes "APK debug générée automatiquement. Installez le fichier app-debug.apk sur Android." \
            --latest
