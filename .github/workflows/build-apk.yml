name: Build Kevin Expert Suite APK (Strict Engineer Fix)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04 # Utilisation d'une version stable plutôt que latest pour éviter les surprises Ubuntu 26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS (Stable for Capacitor)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Activé car nous allons générer le lockfile maintenant

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Environment & Install Dependencies
        run: |
          echo "--- NETTOYAGE ---"
          rm -rf node_modules dist android package-lock.json
          
          echo "--- INSTALLATION DEPENDANCES ---"
          npm install --no-audit --no-fund --legacy-peer-deps
          
          # Vérification critique : Le lockfile doit exister après installation
          if [ ! -f package-lock.json ]; then
            echo "❌ ERREUR CRITIQUE: package-lock.json non généré."
            exit 1
          fi
          echo "✅ Dépendances installées et verrouillées."

      - name: Verify Source Code Integrity
        run: |
          echo "--- VERIFICATION JS ---"
          node --check src/main.js || { echo "❌ Erreur syntaxe JS"; exit 1; }
          
          echo "--- VERIFICATION JSON ---"
          node -e "try { require('./public/data/knowledge.json'); console.log('✅ JSON OK'); } catch(e) { console.error('❌ JSON Error:', e.message); process.exit(1); }"

      - name: Build Web Assets (Vite)
        run: |
          echo "--- BUILD VITE ---"
          npm run build
          
          # Vérification que le dossier dist existe et contient index.html
          if [ ! -f dist/index.html ]; then
            echo "❌ ERREUR: dist/index.html introuvable après build."
            ls -la dist/
            exit 1
          fi
          echo "✅ Web assets générés."

      - name: Initialize Capacitor Android Project
        run: |
          echo "--- INIT CAPACITOR ANDROID ---"
          # Force la suppression du dossier android s'il existe pour éviter les conflits de templates
          rm -rf android
          
          # Initialise la plateforme Android proprement
          npx cap add android
          
          # Vérification immédiate
          if [ ! -d android/app/src/main ]; then
             echo "❌ ERREUR: Structure Android incomplète après cap add."
             exit 1
          fi
          echo "✅ Plateforme Android initialisée."

      - name: Sync Capacitor & Inject Permissions
        run: |
          echo "--- SYNC CAPACITOR ---"
          npx cap sync android
          
          echo "--- INJECTION PERMISSIONS MANIFEST ---"
          python3 << 'EOF'
          import pathlib
          import xml.etree.ElementTree as ET
          import sys

          manifest_path = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          
          if not manifest_path.exists():
              print("❌ AndroidManifest.xml introuvable")
              sys.exit(1)

          tree = ET.parse(manifest_path)
          root = tree.getroot()
          
          ns = {'android': 'http://schemas.android.com/apk/res/android'}
          
          permissions_needed = [
              "INTERNET",
              "ACCESS_NETWORK_STATE",
              "POST_NOTIFICATIONS",
              "READ_MEDIA_IMAGES", 
              "CAMERA"
          ]

          existing_perms = set()
          for perm in root.findall('.//uses-permission', ns):
              name = perm.attrib.get('{http://schemas.android.com/apk/res/android}name')
              if name:
                  existing_perms.add(name.split('.')[-1])

          added_count = 0
          for perm_name in permissions_needed:
              full_perm = f"android.permission.{perm_name}"
              if perm_name not in existing_perms:
                  new_elem = ET.SubElement(root, 'uses-permission')
                  new_elem.set('{http://schemas.android.com/apk/res/android}name', full_perm)
                  added_count += 1
          
          if added_count > 0:
              tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
              print(f"✅ Ajout de {added_count} permissions.")
          else:
              print("ℹ️ Toutes les permissions sont déjà présentes.")
          EOF

      - name: Configure Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew
          # Mise à jour du wrapper vers une version compatible Java 17 / Node 20
          ./gradlew wrapper --gradle-version=8.6
          echo "✅ Gradle configuré."

      - name: Compile Debug APK
        run: |
          cd android
          echo "--- COMPILATION GRADLE ---"
          # --stacktrace permet de voir l'erreur exacte si ça plante
          ./gradlew assembleDebug --stacktrace --warning-mode=all
          
          # Vérification finale du fichier APK
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
             echo "❌ ERREUR FINALE: APK non trouvée à $APK_PATH"
             find . -name "*.apk"
             exit 1
          fi
          echo "✅ APK compilée avec succès : $(ls -lh $APK_PATH)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kevin-expert-suite-v4-stable
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-v4-stable-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Kevin Expert Suite APK V4 Stable - Run ${GITHUB_RUN_NUMBER}" \
            --notes "Build corrigé avec Node 20, nettoyage forcé et vérification stricte." \
            --latest
