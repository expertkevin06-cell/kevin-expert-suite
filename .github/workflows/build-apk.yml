name: Build Kevin Expert Suite APK (Strict Fix)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # IMPORTANT : Pas de cache ici pour éviter l'erreur "lock file not found"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean previous builds (Force Reset)
        run: |
          rm -rf node_modules
          rm -rf dist
          rm -rf android
          echo "✅ Nettoyage effectué."

      - name: Install dependencies & Generate Lockfile
        run: |
          npm install --legacy-peer-deps
          # Génère explicitement le lockfile si absent pour stabiliser le build futur
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi
          echo "✅ Dépendances installées."

      - name: Verify Syntax & JSON Integrity
        run: |
          echo "Checking JS..."
          node --check src/main.js || { echo "❌ JS Error"; exit 1; }
          
          echo "Checking JSON..."
          node -e "try { require('./public/data/knowledge.json'); console.log('✅ JSON OK'); } catch(e) { console.error('❌ JSON Error:', e.message); process.exit(1); }"

      - name: Build Web App (Vite)
        run: |
          npm run build
          ls -la dist/ || { echo "❌ Dist folder missing after build"; exit 1; }
          echo "✅ Web build réussi."

      - name: Add Capacitor Android Platform
        run: |
          # Supprime tout reste potentiel pour éviter les conflits
          rm -rf android
          npx cap add android
          echo "✅ Plateforme Android ajoutée."

      - name: Sync Capacitor
        run: |
          npx cap sync android
          echo "✅ Sync réussi."

      - name: Inject Permissions into Manifest
        run: |
          python3 << 'EOF'
          import pathlib
          import xml.etree.ElementTree as ET

          manifest_path = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          
          if not manifest_path.exists():
              print("❌ AndroidManifest.xml introuvable")
              exit(1)

          tree = ET.parse(manifest_path)
          root = tree.getroot()
          
          ns = {'android': 'http://schemas.android.com/apk/res/android'}
          
          permissions_needed = [
              "INTERNET",
              "ACCESS_NETWORK_STATE",
              "POST_NOTIFICATIONS",
              "READ_MEDIA_IMAGES", 
              "CAMERA"
          ]

          existing_perms = set()
          for perm in root.findall('.//uses-permission', ns):
              name = perm.attrib.get('{http://schemas.android.com/apk/res/android}name')
              if name:
                  existing_perms.add(name.split('.')[-1])

          added_count = 0
          for perm_name in permissions_needed:
              full_perm = f"android.permission.{perm_name}"
              if perm_name not in existing_perms:
                  new_elem = ET.SubElement(root, 'uses-permission')
                  new_elem.set('{http://schemas.android.com/apk/res/android}name', full_perm)
                  added_count += 1
          
          if added_count > 0:
              tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
              print(f"✅ Ajout de {added_count} permissions.")
          else:
              print("ℹ️ Permissions déjà présentes.")
          EOF

      - name: Configure Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew
          ./gradlew wrapper --gradle-version=8.6
          echo "✅ Gradle configuré."

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          echo "✅ APK compilée."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kevin-expert-suite-v4-final
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-v4-fixed-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Kevin Expert Suite APK V4 Fixed - Run ${GITHUB_RUN_NUMBER}" \
            --notes "Build strict avec génération lockfile et nettoyage forcé." \
            --latest
